<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crispy — Smart Video Compression</title>
<style>
  :root { --paper:#F3EEE0; --ink:#141414; --muted:#6E6A62; --flame:#FF5A1F; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper); color: var(--ink); line-height: 1.5;
  }
  .hero { padding: 80px 24px 60px; text-align: center; }
  .brand { font-size: 13px; letter-spacing: 2px; color: var(--flame); font-weight: 600; text-transform: uppercase; }
  h1 { font-size: 48px; margin: 16px 0 12px; line-height: 1.05; }
  .tag { font-size: 18px; color: var(--muted); max-width: 520px; margin: 0 auto 32px; }
  .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .links a {
    display: inline-block; padding: 12px 24px; border-radius: 999px;
    background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600;
  }
  .links a.outline {
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--ink);
  }
  footer {
    padding: 32px 24px; text-align: center; color: var(--muted); font-size: 13px;
    border-top: 1px solid #ddd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#141414; --ink:#F3EEE0; --muted:#B0A89A; }
    .links a.outline { border-color: var(--ink); }
  }
</style>
</head>
<body>
<section class="hero">
  <div class="brand">Crispy</div>
  <h1>Smart Video Compression</h1>
  <p class="tag">Compress videos for Instagram, WhatsApp, TikTok and more — entirely on-device. No upload, no account, no tracking.</p>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html" class="outline">Terms of Service</a>
  </div>
</section>
<footer>
  © 2026 Crispy · Independent iOS Developer · <a href="mailto:sengulfaruk1@gmail.com">sengulfaruk1@gmail.com</a>
</footer>
</body>
</html>
